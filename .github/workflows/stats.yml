# Place at: .github/workflows/stats.yml  (in your AnshuSAHA176/AnshuSAHA176 repo)
# Generates stats SVG cards into /profile-summary-card-output and commits them.
# No external image server involved, so the cards can't "go down" on you.
name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses your personal token if you add one (recommended), else the built-in one
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
